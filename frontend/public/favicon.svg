<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6b57"/>
      <stop offset="0.5" stop-color="#4f9a82"/>
      <stop offset="1" stop-color="#24594a"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64a993"/>
      <stop offset="0.45" stop-color="#e6f2ed"/>
      <stop offset="1" stop-color="#7fb8a4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f2ed"/>
      <stop offset="0.45" stop-color="#7fb8a4"/>
      <stop offset="1" stop-color="#2f6b57"/>
    </linearGradient>
    <radialGradient id="socket" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#1f4a3c"/>
      <stop offset="0.7" stop-color="#12302a"/>
      <stop offset="1" stop-color="#0a1a15"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#f3f9f6"/>
      <stop offset="0.28" stop-color="#b5d6c9"/>
      <stop offset="0.62" stop-color="#4f9a82"/>
      <stop offset="1" stop-color="#173a30"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#173a30"/>
      <stop offset="1" stop-color="#04100c"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d5e8e0"/>
      <stop offset="1" stop-color="#3a7d67"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#12302a" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <!-- back half of the orbit, behind the eye -->
    <path d="M5 32A27 9.5 0 0 1 59 32" transform="rotate(-28 32 32)" fill="none" stroke="url(#ringBack)" stroke-width="2.6" stroke-linecap="butt" opacity="0.85"/>
    <!-- satellite riding the back of the orbit -->
    <circle cx="49" cy="16.8" r="3.3" fill="url(#moon)"/>
    <circle cx="47.9" cy="15.7" r="0.9" fill="#fff" opacity="0.9"/>
    <!-- the eye: a domed socket inside a bevelled rim -->
    <path d="M9 32C16.5 19.5 47.5 19.5 55 32C47.5 44.5 16.5 44.5 9 32Z" fill="url(#socket)" stroke="url(#rim)" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M12.2 30.6C19.5 21.6 44.5 21.6 51.8 30.6" fill="none" stroke="#fff" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <!-- iris sphere, pupil and catch-lights -->
    <circle cx="32" cy="32" r="9.2" fill="url(#iris)"/>
    <circle cx="32" cy="32" r="9.2" fill="none" stroke="#12302a" stroke-width="0.8" opacity="0.6"/>
    <circle cx="32" cy="32" r="3.9" fill="url(#pupil)"/>
    <ellipse cx="28.6" cy="28.4" rx="2.1" ry="1.5" transform="rotate(-30 28.6 28.4)" fill="#fff" opacity="0.95"/>
    <circle cx="35.6" cy="35.4" r="0.8" fill="#fff" opacity="0.55"/>
    <!-- front half of the orbit, passing over the eye -->
    <path d="M59 32A27 9.5 0 0 1 5 32" transform="rotate(-28 32 32)" fill="none" stroke="url(#ringFront)" stroke-width="2.6" stroke-linecap="butt"/>
    <path d="M57.6 32.6A25.8 8.6 0 0 1 6.4 32.6" transform="rotate(-28 32 32)" fill="none" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
