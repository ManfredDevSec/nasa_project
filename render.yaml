# Render Blueprint for the SightLine backend (docs/01 §7, task T12).
# Render reads this when you create the service with New → Blueprint.
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sightline-api
    runtime: python
    plan: free
    region: frankfurt          # can't be changed later; pick the same region for the Neon database
    branch: main               # main is always deployable (docs/01 §8)
    rootDir: backend
    autoDeployTrigger: commit  # every push/merge to main redeploys
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn sightline.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION     # Render needs the full version; matches the Docker image (3.12)
        value: "3.12.10"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true     # Render creates a random secret once
      - key: DATABASE_URL       # paste the Neon *pooled* connection string when Render asks
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # add the deployed frontend URL here once it exists
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL       # where password-reset links point; change to the deployed frontend later
        value: "http://localhost:5173"
      # Not set on purpose:
      # - DJANGO_ALLOWED_HOSTS: Render's own hostname is added automatically (settings.py).
      # - REDIS_URL: not needed for one small server; the in-memory cache is used.
      # - EMAIL_*: emails (password reset) print to the Render logs until SMTP is configured.
