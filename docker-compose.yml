services:
  backend:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - sightline_data:/app/data
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
      DEBUG: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  sightline_data:
